    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static | Reihan Fikri</title>
    <meta name="description" content="Listen to 'Static', the latest single by Reihan Fikri.">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
            --secondary-text: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 2.5rem;
        }

        .about {
            margin-bottom: 2.5rem;
        }

        .about h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--secondary-text);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .about p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-color);
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 1rem 3rem;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.8rem;
            border-radius: 2px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .cta-button:hover {
            background-color: #d0d0d0;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .cover-art {
                max-width: 100%;
            }
            .cta-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <main>
        <!-- Official Cover Art -->
        <img 
            src="https://i.scdn.co/image/ab67616d0000b273717aafd6aa870748002cd9b8" 
            alt="Static - Reihan Fikri Cover Art" 
            class="cover-art"
        >
        
        <!-- About the Release -->
        <section class="about">
            <h2>About the Release</h2>
            <p>"Static" is the latest single by Reihan Fikri, officially released on November 15, 2026. This composition further establishes the artist's distinctive sonic identity and is now available for streaming.</p>
        </section>

        <!-- Listen to Spotify Button -->
        <a 
            href="https://open.spotify.com/track/7gasSqXyelCM9PmoEQgFHj"
            target="_blank" 
            rel="noopener noreferrer" 
            class="cta-button"
			onclick="if(typeof fbq !== 'undefined') { fbq('track', 'ViewContent', {content_name: 'Static', content_category: 'Music'}); }"
        >
            Listen to Spotify
        </a>
    </main>

</body>
</html>
